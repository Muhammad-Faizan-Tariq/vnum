name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push cancels an older run, except deploys, which queue so two never overlap.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Type-check, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci # postinstall also runs `prisma generate`
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          # Placeholders: the build never connects to a database.
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          PAYMENT_WEBHOOK_SECRET: build-only-placeholder-secret-0000

  e2e:
    name: End-to-end tests (Playwright)
    # The suite takes several minutes; it gates pull requests, not every deploy.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vnum
          POSTGRES_PASSWORD: vnum_local_only
          POSTGRES_DB: postgres
        # The test setup looks for Postgres on this port and creates its own vnum_test database.
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U vnum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  deploy:
    name: Deploy to the Hostinger server
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pinned host key (not trust-on-first-use) so the deploy cannot be redirected to another machine.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Pull, rebuild and restart
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          APP_DIR: ${{ vars.APP_DIR || 'vnum-faizan' }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SERVER_PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$SERVER_USER@$SERVER_HOST" APP_DIR="$APP_DIR" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          git fetch --prune origin main
          git reset --hard origin/main
          docker compose up -d --build --remove-orphans
          # Wait for the website to report healthy; fail the deploy if it never does.
          for i in $(seq 1 40); do
            status=$(docker inspect --format '{{.State.Health.Status}}' vnum-faizan-web-1 2>/dev/null || echo starting)
            [ "$status" = "healthy" ] && echo "web is healthy" && break
            [ "$i" = 40 ] && { echo "web did not become healthy"; docker compose logs --tail 80 web worker; exit 1; }
            sleep 5
          done
          docker compose ps
          docker image prune -f >/dev/null
          REMOTE
